<text x="40" y="744" font-family="Poppins, 'Atkinson Hyperlegible', Arial, sans-serif" font-size="11" fill="#0A2B38">Each zone gets two Friend Fence panels; the gap between them is the zone's doorway, and the paw path leads to it from the Friends Circle.</text>
<text x="40" y="761" font-family="Poppins, 'Atkinson Hyperlegible', Arial, sans-serif" font-size="11" fill="#0A2B38">Quiet zones (Booker, Lumi) sit away from active ones (Bop) and from the door. Zuri's Discovery Zone sits near the sink and tables.</text>
<text x="40" y="778" font-family="Poppins, 'Atkinson Hyperlegible', Arial, sans-serif" font-size="11" fill="#0A2B38">Two adult positions see every zone over 24 in fences. Keep the exit path 36 in clear and wall art inside the 20 percent planning cap.</text>
