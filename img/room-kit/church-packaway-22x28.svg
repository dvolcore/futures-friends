<text x="40" y="804" font-family="Poppins, 'Atkinson Hyperlegible', Arial, sans-serif" font-size="11" fill="#0A2B38">Sunday reset in about 15 minutes: roll the rugs into their bags, fold the fences flat, retract the banner stands, wheel the cart into the closet.</text>
<text x="40" y="821" font-family="Poppins, 'Atkinson Hyperlegible', Arial, sans-serif" font-size="11" fill="#0A2B38">Banner stands replace wall posters and signs, so nothing is taped or hung. Sit spots go down only on carpet; on tile use the mats' own edges.</text>
<text x="40" y="838" font-family="Poppins, 'Atkinson Hyperlegible', Arial, sans-serif" font-size="11" fill="#0A2B38">Kansas has no religious exemption; a Missouri program may be license-exempt but still needs 35 sq ft per child and a fire inspection.</text>
