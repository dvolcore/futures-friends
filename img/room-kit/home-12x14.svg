<text x="40" y="504" font-family="Poppins, 'Atkinson Hyperlegible', Arial, sans-serif" font-size="11" fill="#0A2B38">Small-room rule: Bop's Movement Zone shares the Friends Circle; the 6 ft circle rug becomes the move space at Bop &amp; Go time.</text>
<text x="40" y="521" font-family="Poppins, 'Atkinson Hyperlegible', Arial, sans-serif" font-size="11" fill="#0A2B38">Lumi's Calm Corner sits in the adult's line of sight: a soft corner, never a hidden one. Fences stay 24 in high or lower.</text>
<text x="40" y="538" font-family="Poppins, 'Atkinson Hyperlegible', Arial, sans-serif" font-size="11" fill="#0A2B38">Before the first child arrives, check the zones against the room's licensed usable floor space and keep the door swing and exit path clear.</text>
